name: Deploy to GitHub Pages

# On demand only. There is deliberately no `push` trigger: merging to `main`
# does not publish the site. A maintainer starts a deployment from the Actions
# tab ("Run workflow"), which is the GitHub Pages equivalent of the manual CLI
# upload this project used before.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments overwrite each other; queue instead of cancelling,
# so a running publish is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No Python step: the build reads scripts/icon_categories.py and the
      # generated life_events.json files as plain text, it does not run them.
      - name: Build
        run: npm run build

      # `enablement: true` creates the Pages site (build type "workflow") on
      # first use instead of failing with "Get Pages site: Not Found" — every
      # run of this workflow had died on that step because the repository's
      # Pages site was never provisioned.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
