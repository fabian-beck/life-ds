name: Checks

# Every check this repository owns used to run only when a person or an agent
# remembered to run it, and the drift that produced was already visible in the
# tree. These run on every push instead.
#
# Two jobs, and both ask whether the implementation is sound: `checks` runs
# the formatting, lint, types, the build, the unit tests, and the report's
# agreement with its source; `interface` runs the one browser journey. No job
# reads the generated corpus. The quality of the data is ensured by the
# generation pipeline that writes it (see AGENTS.md).
#
# A branch pushed here fires `push`, and opening a pull request from it fires
# `pull_request` as well, so the jobs used to run twice over the same commit.
# The push already covers every branch in this repository — which integrates by
# pushing to `main` rather than through pull requests — so the `pull_request`
# trigger is left the one thing a push here cannot reach: a branch in a fork.
# The `if` on each job below is what draws that line; the trigger itself cannot.
#
# Deployment is deliberately not here: it is `deploy-pages.yml`, which runs on
# a push onto the `deploy` branch, so a green run of this workflow releases
# nothing. See README "Deployment". Pushing `main` onto `deploy` would re-check
# a tree that had just been checked, which is why `deploy` is the one branch
# this workflow ignores.
on:
  push:
    branches-ignore:
      - deploy
  pull_request:

# A newer push to the same branch supersedes an older run of this workflow —
# except on `main`, where a superseded run means a commit that is already
# integrated never finished being checked. That is the one branch whose runs
# have to be allowed to finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, and tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The floor the scripts support is 3.10, and mypy is configured to check
      # against it whatever interpreter runs here (pyproject.toml, python_version).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      # requirements-dev.txt is what `npm run validate` shells out to: without
      # black and flake8 it fails with "No module named black".
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Formatting and lint
        run: npm run validate

      # mypy from cold spends about ten seconds re-analyzing dependencies that
      # did not change; it invalidates its own entries by file hash, so the
      # cache only has to be present, not fresh. The key carries the commit so
      # every run writes an entry back — a cache entry is immutable, so a key
      # that never varies is written once and then never updated again.
      #
      # Restore and save are separate actions because `actions/cache` saves on
      # the way out only when the whole job succeeded. A cache that only a green
      # run can write is one this repository would often not write at all.
      - name: Restore the mypy cache
        uses: actions/cache/restore@v5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}-

      - name: Python types
        id: mypy
        run: npm run type-check:py

      - name: Save the mypy cache
        if: always() && steps.mypy.conclusion != 'skipped'
        uses: actions/cache/save@v5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}-${{ github.sha }}

      - name: Build
        run: npm run build

      - name: Python tests
        run: python -m pytest

      # The report is computed from the generation scripts, so a script change
      # not rebuilt into it leaves the report describing old code.
      - name: The technical report matches its source
        run: python scripts/generate_report.py --check

  interface:
    name: Interface tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Only Chromium: playwright.config.js runs the logic project without a
      # browser at all and the smoke test against a Pixel 7.
      #
      # The build is keyed by the Playwright version rather than by the
      # lockfile, since that is what decides which revision `install` fetches.
      # A hit still runs `install-deps`, which is the apt half of `--with-deps`:
      # the cache carries the browser, not the system libraries it links.
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Chromium build
        id: chromium
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        id: chromium-install
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the libraries Chromium links
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Saved separately for the same reason as the mypy cache: a download this
      # job then fails on is a download the next run would have to repeat.
      - name: Save the Chromium build
        if: always() && steps.chromium-install.conclusion == 'success'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Interface tests
        run: npm run test:interface

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
