<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Life Data Stories</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews. A static host serves this one document for every route
         and an unfurler does not run the router, so these tags describe the
         site rather than the story behind the hash. %SITE_URL% is substituted
         at build time; see socialCardPlugin in vite.config.js. -->
    <meta
      name="description"
      content="Biographies as interactive data stories: each life presented at once as narrative, an event timeline, a map, and a social network."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Life Data Stories" />
    <meta property="og:title" content="Life Data Stories" />
    <meta
      property="og:description"
      content="Biographies as interactive data stories: each life presented at once as narrative, an event timeline, a map, and a social network."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Life Data Stories landing page, showing a gallery of generated portraits."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts are self-hosted and bundled; see src/fonts.css. Nothing in this
         document may load from a third-party origin: a render-blocking <link>
         here gates the first paint on that host staying reachable. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
