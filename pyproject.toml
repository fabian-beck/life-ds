[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  data/people/.*/cache
)/
'''

[tool.mypy]
python_version = "3.12"
# The scripts are built on Pydantic models. Without this plugin mypy does not
# understand that `Field(None, ...)` supplies a default, and reports every such
# field as a missing required argument at each construction site.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'data/people/.*/cache/',
    'venv/',
    '.venv/'
]
