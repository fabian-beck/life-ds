[tool.black]
line-length = 88
# Python 3.10 is the floor: the scripts use PEP 604 unions (X | Y), which need
# it, and 3.9 reached end of life in October 2025.
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  data/people/.*/cache
)/
'''

[tool.mypy]
# The lowest version supported, not the one in the venv: checking against the
# floor is what catches syntax that would break on it.
python_version = "3.10"
# The scripts are built on Pydantic models. Without this plugin mypy does not
# understand that `Field(None, ...)` supplies a default, and reports every such
# field as a missing required argument at each construction site.
plugins = ["pydantic.mypy"]
# The generation scripts are not a package: they and the fact-checking
# evaluation import config and utils by bare name, having put scripts/ on
# sys.path. mypy needs the same search path to resolve those imports.
mypy_path = "scripts"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'data/people/.*/cache/',
    'venv/',
    '.venv/'
]
