# Netlify watches the `deploy` branch and builds every update to it. Advancing
# that branch is the whole deployment: `main` is integrated continuously and
# never published on its own, so releasing stays a deliberate act. Nothing else
# publishes the site — there is no deployment workflow in .github/workflows.
#
# Netlify reads this file from the branch it is building, so a change here
# takes effect only once it reaches `deploy`.
#
# Netlify serves the site from the domain root, not from the `/life-ds/`
# subdirectory the dev server and the interface tests use, so the build has to
# be told: without `VITE_BASE_PATH=/` every asset URL in `index.html` points
# into `/life-ds/` and answers 404 here. See README "Deployment" for the rest
# of the story.
[build]
  command = "VITE_BASE_PATH=/ npm run build"
  publish = "dist"

[build.environment]
  # The version the checks workflow builds on. Netlify's default image tracks
  # its own release schedule, and a build that publishes should not be the one
  # place the toolchain differs.
  NODE_VERSION = "22"

# Netlify Functions. The one function, netlify/functions/evaluation.mjs, is the
# log endpoint of the user-evaluation deployment; it answers 404 on every other
# deployment, so bundling it with the normal site publishes nothing.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The user-evaluation deployment: the same site built from the
# `deploy-evaluation` branch, in Vite's evaluation mode, which adds the
# participant gate, the interaction logger, and the analysis page. Enable the
# branch under Site configuration → Build & deploy → Branches and deploy
# contexts, and it publishes at `deploy-evaluation--<site>.netlify.app`; the
# logs go to the site's Netlify Blobs store, which every deploy of the site
# shares and which no other deploy reads or writes. See
# docs/agent/user-evaluation.md, including for running it as a site of its own.
[context.deploy-evaluation]
  command = "VITE_BASE_PATH=/ npm run build:evaluation"

[context.deploy-evaluation.environment]
  # Read by the function at runtime: the switch that lets it store and serve
  # logs at all.
  EVALUATION_MODE = "1"
